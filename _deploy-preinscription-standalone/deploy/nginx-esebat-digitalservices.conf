# UniPortail SEUL sur https://esebat-digitalservices.com (racine du domaine)
# Copier vers /etc/nginx/conf.d/esebat-digitalservices.com.conf
# ou inclure depuis la config Hestia (nginx.ssl.conf).
#
# Prérequis :
#   APP_ROOT = chemin du clone Git (ex. /var/www/uniportail)
#   Build : $APP_ROOT/frontend/dist
#   API   : pm2 uniportail-api → 127.0.0.1:5000

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name esebat-digitalservices.com www.esebat-digitalservices.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name esebat-digitalservices.com www.esebat-digitalservices.com;

    # Adapter si certificat Let’s Encrypt / Hestia :
    ssl_certificate     /home/admin/conf/web/esebat-digitalservices.com/ssl/esebat-digitalservices.com.pem;
    ssl_certificate_key /home/admin/conf/web/esebat-digitalservices.com/ssl/esebat-digitalservices.com.key;
    # Alternative Certbot :
    # ssl_certificate     /etc/letsencrypt/live/esebat-digitalservices.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/esebat-digitalservices.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/uniportail/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # Ancien déploiement sous /uniportail/ → racine
    location ~ ^/uniportail/(.*)$ {
        return 301 https://$host/$1;
    }
    location = /uniportail {
        return 301 https://$host/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
