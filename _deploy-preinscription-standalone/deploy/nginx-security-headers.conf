# En-têtes de sécurité HTTP — à inclure dans le bloc server { } qui sert le frontend (HTTPS).
# Exemple : include /etc/nginx/snippets/uniportail-security-headers.conf;
#
# Le mot-clé « always » applique aussi les en-têtes aux réponses d’erreur (4xx/5xx).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# CSP adaptée au frontend Vite/React (Google Fonts, reCAPTCHA, Socket.IO même origine).
# Si votre API est sur un autre domaine, ajoutez-le dans connect-src (ex. https://api.votredomaine.com).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-src https://www.google.com https://www.recaptcha.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
