# Exemple de configuration nginx pour uniportail-digital.com (ou équivalent).
# Copier vers /etc/nginx/sites-available/ puis activer par lien symbolique.
#
# Prérequis : certificat TLS (Let’s Encrypt), build frontend dans /var/www/uniportail/dist,
# backend Node en écoute sur 127.0.0.1:5000 (ou ajuster proxy_pass).

server_tokens off;

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name uniportail-digital.com www.uniportail-digital.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uniportail-digital.com www.uniportail-digital.com;

    # ssl_certificate /etc/letsencrypt/live/uniportail-digital.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/uniportail-digital.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/uniportail/dist;
    index index.html;

    # En-têtes de sécurité sur toutes les réponses statiques et le fallback SPA
    include /chemin/vers/preinscription-univ/deploy/nginx-security-headers.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
