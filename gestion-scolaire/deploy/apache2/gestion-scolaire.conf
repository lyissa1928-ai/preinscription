# Configuration Apache2 pour Gestion Scolaire
# À placer dans /etc/apache2/sites-available/

<VirtualHost *:80>
    ServerName gestion-scolaire.local

    # Frontend Next.js (proxy vers Node)
    ProxyPreserveHost On
    ProxyPass / http://localhost:3001/
    ProxyPassReverse / http://localhost:3001/

    # API Backend (optionnel : sous /api)
    # ProxyPass /api http://localhost:3000/
    # ProxyPassReverse /api http://localhost:3000/

    ErrorLog ${APACHE_LOG_DIR}/gestion-scolaire-error.log
    CustomLog ${APACHE_LOG_DIR}/gestion-scolaire-access.log combined
</VirtualHost>
