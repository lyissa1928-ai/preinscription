# VirtualHost Apache complet — UniPortail SEUL à la racine
# Généré / installé par deploy/configurer-racine-esebat.sh
# Chemins remplacés : __APP_ROOT__ __DOMAIN__ __SSL_CERT__ __SSL_KEY__

<VirtualHost *:80>
    ServerName __DOMAIN__
    ServerAlias www.__DOMAIN__

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName __DOMAIN__
    ServerAlias www.__DOMAIN__

    SSLEngine on
    SSLCertificateFile __SSL_CERT__
    SSLCertificateKeyFile __SSL_KEY__

    DocumentRoot __APP_ROOT__/frontend/dist

    ErrorLog ${APACHE_LOG_DIR}/__DOMAIN__-error.log
    CustomLog ${APACHE_LOG_DIR}/__DOMAIN__-access.log combined

    # Ancien déploiement /uniportail/ → racine
    RedirectMatch 301 ^/uniportail/?(.*)$ /$1

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # API Node (PM2 uniportail-api :5000)
    ProxyPass        /api/       http://127.0.0.1:5000/api/
    ProxyPassReverse /api/       http://127.0.0.1:5000/api/
    ProxyPass        /uploads/   http://127.0.0.1:5000/uploads/
    ProxyPassReverse /uploads/   http://127.0.0.1:5000/uploads/

    # WebSocket (chat)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket.io/(.*)$ ws://127.0.0.1:5000/socket.io/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/socket.io/(.*)$ http://127.0.0.1:5000/socket.io/$1 [P,L]
    ProxyPassReverse /socket.io/ http://127.0.0.1:5000/socket.io/

    <Directory __APP_ROOT__/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
</VirtualHost>
